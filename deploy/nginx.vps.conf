# Production vhost on the VPS. The API container listens on 127.0.0.1 only; nginx terminates TLS
# (certificate issued by certbot) and is the single public entry point.
server {
    listen 80;
    server_name payflow.109-205-176-124.sslip.io;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
